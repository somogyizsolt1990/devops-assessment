apiVersion: v1
kind: Pod
metadata:
  name: {{ include "myapp.fullname" . }}-test
  # No selector labels: the Service must not pick this pod as an endpoint.
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.37
      command:
        - sh
        - -c
        - wget -qO- -T 5 http://{{ include "myapp.fullname" . }}:{{ .Values.service.port }}/health | grep -q '"status":"ok"'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
